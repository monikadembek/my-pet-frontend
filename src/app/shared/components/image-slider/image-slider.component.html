<div class="slider">
  @if (showNavigation) {
    <div>
      <button (click)="goToPrevious()" class="arrow leftArrow">❰</button>
      <button (click)="goToNext()" class="arrow rightArrow">❱</button>
    </div>
  }
  <div class="slide" [ngStyle]="{ 'background-image': getCurrentSlideUrl() }">
    <div class="slide-titles">
      <h2 class="title">{{ slides[currentIndex].title }}</h2>
      <h3 class="text-center subtitle">{{ slides[currentIndex].subtitle }}</h3>
    </div>
  </div>
  @if (showIndicators) {
    <div class="slider-dots">
      @for (slide of slides; let slideIndex = $index; track slideIndex) {
        <button class="dot" (click)="goToSlide(slideIndex)">&nbsp;</button>
      }
    </div>
  }
</div>
